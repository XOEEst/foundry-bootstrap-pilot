schema_version: 1
repository_identity: example-customer/foundry-bootstrap-pilot
default_branch: main
source_root: agents/travel-approver-live/app
package_root: agents/travel-approver-live/app
project_endpoint: https://example.services.ai.azure.com/api/projects/travel-approver-live
agent_name: travel-approver-live
expected_version: "2026-08-17.1"
authentication_method: oidc
static_credentials_allowed: false
hosted_runtime:
  kind: hosted
  runtime: python_3_13
  entry_point:
    - python
    - app/main.py
  dependency_resolution: remote_build
  protocol_name: responses
  protocol_version: "2.0.0"
  cpu: "0.5"
  memory: 1Gi
  model_environment_variable: AZURE_AI_MODEL_DEPLOYMENT_NAME
