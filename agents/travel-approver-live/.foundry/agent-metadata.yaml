schema_version: 1
repository_identity: example-customer/foundry-bootstrap-pilot
default_branch: main
source_root: agents/travel-approver-live/app
package_root: agents/travel-approver-live
project_endpoint: https://luechen-eus2-foundry.services.ai.azure.com/api/projects/luechen-eus2-fdp
foundry_account_resource_id: /subscriptions/7b43cfa1-da92-48cc-865d-5499466b3b5c/resourceGroups/luechen-eastus2/providers/Microsoft.CognitiveServices/accounts/luechen-eus2-foundry
agent_name: foundry-opt-bootstrap-pilot-aligned
authentication_method: oidc
static_credentials_allowed: false
runtime_environment:
  project_endpoint_environment_variable: FOUNDRY_PROJECT_ENDPOINT
  primary_model_environment_variable: AZURE_AI_MODEL_DEPLOYMENT_NAME
  secondary_model_environment_variable: FOUNDRY_MODEL_NAME
  optional_environment_variables:
    - AGENT_NAME
    - AGENT_INSTRUCTIONS
hosted_runtime:
  kind: hosted
  runtime: python_3_13
  entry_point:
    - python
    - app/main.py
  dependency_resolution: remote_build
  protocol_name: responses
  protocol_version: "2.0.0"
  cpu: "0.5"
  memory: 1Gi
  model_environment_variable: AZURE_AI_MODEL_DEPLOYMENT_NAME
  alternate_model_environment_variables:
    - FOUNDRY_MODEL_NAME
model_deployments:
  - alias: baseline-model
    deployment_name: gpt-4.1
    model_format: OpenAI
    model_name: gpt-4.1
    model_version: "1"
    required_capabilities:
      - name: responses
        enabled: true
